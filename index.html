<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>별을 피하는 게임</title>
    <style>
      :root {
        --bg1: #0b1021;
        --bg2: #1d2340;
        --panel: rgba(20, 26, 44, 0.78);
        --line: rgba(255, 255, 255, 0.12);
        --text: #edf3ff;
        --accent: #7dd3fc;
        --accent-2: #a78bfa;
        --danger: #fb7185;
        --good: #4ade80;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1e2a4d 0%, var(--bg1) 42%, #050b16 100%);
        color: var(--text);
      }

      .game-shell {
        width: min(92vw, 480px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.03);
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .hud span {
        font-size: 0.92rem;
      }

      #gameCanvas {
        display: block;
        width: 100%;
        height: auto;
        background: linear-gradient(180deg, rgba(70, 90, 145, 0.18), rgba(10, 14, 24, 0.9));
        border-bottom: 1px solid var(--line);
      }

      .controls {
        display: flex;
        justify-content: center;
        padding: 14px;
        background: rgba(255, 255, 255, 0.02);
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 1rem;
        font-weight: 700;
        color: #08111d;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(125, 211, 252, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 30px rgba(125, 211, 252, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <span>점수: <b id="score">0</b></span>
        <span>생명: <b id="lives">3</b></span>
        <span>최고: <b id="best">0</b></span>
      </div>
      <canvas id="gameCanvas" width="420" height="560" aria-label="게임 화면"></canvas>
      <div class="controls">
        <button id="startBtn" type="button">게임 시작</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const bestEl = document.getElementById('best');
      const startBtn = document.getElementById('startBtn');

      const keys = {
        left: false,
        right: false,
      };

      const state = {
        started: false,
        gameOver: false,
        score: 0,
        highScore: Number(localStorage.getItem('meteorBest') || 0),
        lives: 3,
        invulnerableTimer: 0,
        spawnTimer: 0,
        lastTime: 0,
        player: {
          x: 180,
          y: 500,
          w: 54,
          h: 18,
          speed: 360,
        },
        enemies: [],
        particles: [],
      };

      function updateHud() {
        scoreEl.textContent = Math.floor(state.score);
        livesEl.textContent = state.lives;
        bestEl.textContent = Math.floor(state.highScore);
      }

      function resetGame() {
        state.started = true;
        state.gameOver = false;
        state.score = 0;
        state.lives = 3;
        state.invulnerableTimer = 0;
        state.spawnTimer = 0.7;
        state.player.x = canvas.width / 2 - state.player.w / 2;
        state.player.y = canvas.height - 48;
        state.enemies = [];
        state.particles = [];
        updateHud();
        startBtn.textContent = '다시 시작';
      }

      function spawnEnemy() {
        const size = 18 + Math.random() * 22;
        const enemy = {
          x: Math.random() * (canvas.width - size),
          y: -size,
          size,
          speed: 140 + Math.random() * 150 + state.score * 0.05,
          drift: (Math.random() - 0.5) * 60,
        };
        state.enemies.push(enemy);
      }

      function createBurst(x, y, color) {
        for (let i = 0; i < 14; i++) {
          state.particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 200,
            vy: (Math.random() - 0.5) * 200,
            life: 0.7 + Math.random() * 0.5,
            radius: 2 + Math.random() * 4,
            color,
          });
        }
      }

      function rectCollision(a, b) {
        return (
          a.x < b.x + b.size &&
          a.x + a.w > b.x &&
          a.y < b.y + b.size &&
          a.y + a.h > b.y
        );
      }

      function update(delta) {
        if (!state.started || state.gameOver) {
          return;
        }

        if (state.invulnerableTimer > 0) {
          state.invulnerableTimer -= delta;
        }

        state.score += delta * 22;
        if (state.score > state.highScore) {
          state.highScore = state.score;
          localStorage.setItem('meteorBest', String(Math.floor(state.highScore)));
        }

        if (keys.left) {
          state.player.x -= state.player.speed * delta;
        }
        if (keys.right) {
          state.player.x += state.player.speed * delta;
        }

        state.player.x = Math.max(0, Math.min(canvas.width - state.player.w, state.player.x));

        state.spawnTimer -= delta;
        if (state.spawnTimer <= 0) {
          spawnEnemy();
          state.spawnTimer = Math.max(0.38, 1.1 - state.score / 500);
        }

        for (let i = state.enemies.length - 1; i >= 0; i--) {
          const enemy = state.enemies[i];
          enemy.x += enemy.drift * delta;
          enemy.y += enemy.speed * delta;

          if (enemy.x < 0 || enemy.x + enemy.size > canvas.width) {
            enemy.drift *= -1;
            enemy.x = Math.max(0, Math.min(canvas.width - enemy.size, enemy.x));
          }

          if (rectCollision(state.player, { x: enemy.x, y: enemy.y, w: enemy.size, h: enemy.size })) {
            if (state.invulnerableTimer <= 0) {
              state.lives -= 1;
              state.invulnerableTimer = 1.0;
              state.enemies.splice(i, 1);
              createBurst(enemy.x + enemy.size / 2, enemy.y + enemy.size / 2, '#fb7185');

              if (state.lives <= 0) {
                state.lives = 0;
                state.gameOver = true;
                state.started = false;
                startBtn.textContent = '다시 도전';
                createBurst(state.player.x + state.player.w / 2, state.player.y + state.player.h / 2, '#facc15');
              }
            }
          } else if (enemy.y > canvas.height) {
            state.enemies.splice(i, 1);
          }
        }

        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx * delta;
          p.y += p.vy * delta;
          p.life -= delta;
          if (p.life <= 0) {
            state.particles.splice(i, 1);
          }
        }

        updateHud();
      }

      function drawStarField() {
        ctx.fillStyle = '#09111b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 40; i++) {
          const x = (i * 97) % canvas.width;
          const y = (i * 53 + (state.score * 0.2) % canvas.height) % canvas.height;
          const r = 1 + (i % 3);
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPlayer() {
        const x = state.player.x;
        const y = state.player.y;
        const w = state.player.w;
        const h = state.player.h;

        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(x + 8, y, w - 16, h);
        ctx.fillStyle = '#a78bfa';
        ctx.fillRect(x, y + 8, w, h - 8);

        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(x + w / 2 - 4, y - 10, 8, 12);
      }

      function drawEnemies() {
        for (const enemy of state.enemies) {
          ctx.fillStyle = '#f87171';
          ctx.beginPath();
          ctx.arc(enemy.x + enemy.size / 2, enemy.y + enemy.size / 2, enemy.size / 2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fecdd3';
          ctx.fillRect(enemy.x + enemy.size / 2 - 2, enemy.y + enemy.size / 2 - 6, 4, 12);
        }
      }

      function drawParticles() {
        for (const p of state.particles) {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawMessage() {
        if (!state.started && !state.gameOver) {
          ctx.fillStyle = 'rgba(10,15,25,0.5)';
          ctx.fillRect(50, 170, 320, 130);
          ctx.fillStyle = '#f8fafc';
          ctx.font = 'bold 28px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('별을 피워라!', 210, 220);
          ctx.font = '18px Arial';
          ctx.fillText('왼쪽/오른쪽 이동', 210, 250);
          ctx.fillText('충돌하면 생명이 줄어들어요', 210, 278);
        }

        if (state.gameOver) {
          ctx.fillStyle = 'rgba(15,22,34,0.72)';
          ctx.fillRect(55, 180, 310, 160);
          ctx.fillStyle = '#fef3c7';
          ctx.font = 'bold 30px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('게임 오버', 210, 230);
          ctx.font = '20px Arial';
          ctx.fillText('최종 점수: ' + Math.floor(state.score), 210, 270);
        }
      }

      function loop(timestamp) {
        const delta = Math.min((timestamp - state.lastTime) / 1000 || 0.016, 0.033);
        state.lastTime = timestamp;

        update(delta);
        drawStarField();
        drawPlayer();
        drawEnemies();
        drawParticles();
        drawMessage();

        requestAnimationFrame(loop);
      }

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') {
          keys.left = true;
        }
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') {
          keys.right = true;
        }
      });

      document.addEventListener('keyup', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') {
          keys.left = false;
        }
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') {
          keys.right = false;
        }
      });

      canvas.addEventListener('pointermove', (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const limit = canvas.width - state.player.w;
        state.player.x = Math.max(0, Math.min(limit, x - state.player.w / 2));
      });

      startBtn.addEventListener('click', () => {
        resetGame();
      });

      updateHud();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
