<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양이 · 나의 작은 챗봇</title>
    <style>
        :root {
            --ink: #25221e;
            --muted: #8a8176;
            --cream: #f7f1e8;
            --paper: #fffdf9;
            --orange: #e8783d;
            --orange-dark: #bd5428;
            --line: #eadfd2;
            --shadow: 0 24px 70px rgba(79, 52, 30, .12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--cream);
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
        }

        .shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
            overflow: hidden;
        }

        .sidebar {
            position: relative;
            padding: 34px 28px;
            background: #292620;
            color: #fffaf3;
            overflow: hidden;
        }

        .sidebar::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            left: -100px;
            bottom: -110px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 50%;
            box-shadow: 0 0 0 36px rgba(255,255,255,.03), 0 0 0 72px rgba(255,255,255,.025);
        }

        .brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.03em; }
        .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; color: #292620; background: #f6b26a; border-radius: 11px; font-size: 18px; }
        .eyebrow { margin: 70px 0 13px; color: #c8bbae; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
        .sidebar h1 { max-width: 230px; margin: 0; font-family: Georgia, serif; font-size: clamp(36px, 4vw, 48px); font-weight: 400; line-height: 1.08; letter-spacing: -.05em; }
        .sidebar-copy { max-width: 220px; margin: 20px 0 0; color: #b8afa5; font-size: 14px; line-height: 1.75; }
        .nav { position: relative; z-index: 1; display: grid; gap: 8px; margin-top: 80px; }
        .nav a { padding: 12px 14px; color: #b8afa5; border-radius: 10px; text-decoration: none; font-size: 14px; }
        .nav a.active, .nav a:hover { color: #fffaf3; background: rgba(255,255,255,.09); }
        .nav a.active::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 10px 2px 0; background: #f6b26a; border-radius: 50%; }

        main { min-width: 0; padding: 30px clamp(22px, 5vw, 72px); background: radial-gradient(circle at 90% 0%, #fff7e9 0, transparent 30%), var(--cream); }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 50px; }
        .topbar p { margin: 0; color: var(--muted); font-size: 13px; }
        .status { display: flex; align-items: center; gap: 8px; color: #6d685f; font-size: 12px; }
        .status i { width: 8px; height: 8px; background: #72a56a; border-radius: 50%; box-shadow: 0 0 0 4px #e0eddc; }

        .intro { max-width: 760px; margin-bottom: 30px; }
        .intro h2 { margin: 0; font-family: Georgia, serif; font-size: clamp(34px, 5vw, 62px); font-weight: 400; line-height: 1.04; letter-spacing: -.06em; }
        .intro h2 span { color: var(--orange); }
        .intro p { margin: 17px 0 0; color: var(--muted); font-size: 15px; }

        .chat-card { max-width: 900px; min-height: 500px; display: flex; flex-direction: column; background: var(--paper); border: 1px solid rgba(234,223,210,.8); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
        .chat-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
        .profile { display: flex; align-items: center; gap: 12px; }
        .avatar { display: grid; place-items: center; width: 40px; height: 40px; background: #f9c990; border-radius: 13px; font-size: 21px; }
        .profile strong { display: block; font-size: 14px; }
        .profile small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
        .more { color: var(--muted); font-size: 22px; }
        .messages { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 26px 24px; }
        .message { max-width: 72%; padding: 14px 17px; border-radius: 4px 16px 16px 16px; font-size: 14px; line-height: 1.6; animation: rise .35s ease both; }
        .message.bot { align-self: flex-start; background: #f3ede5; }
        .message.user { align-self: flex-end; color: #fff; background: var(--orange); border-radius: 16px 4px 16px 16px; }
        .time { display: block; margin-top: 7px; color: #aaa096; font-size: 10px; }
        .user .time { color: #fbd6be; }
        .composer { display: flex; gap: 10px; margin: 0 18px 18px; padding: 7px 8px 7px 17px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
        .composer input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--ink); background: transparent; font: inherit; font-size: 14px; }
        .composer input::placeholder { color: #b5aca1; }
        .send { width: 40px; height: 40px; border: 0; color: #fff; background: var(--orange); border-radius: 10px; cursor: pointer; font-size: 18px; transition: background .2s, transform .2s; }
        .send:hover { background: var(--orange-dark); transform: translateY(-1px); }

        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 700px) { .shell { display: block; } .sidebar { min-height: 280px; padding: 24px; } .eyebrow { margin-top: 38px; } .nav { display: flex; margin-top: 28px; } .nav a { padding: 9px 10px; } main { padding: 24px 16px 40px; } .topbar { margin-bottom: 38px; } .message { max-width: 88%; } }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">⌁</span> little chat</div>
            <p class="eyebrow">A quiet corner</p>
            <h1>오늘은<br>어떤 하루였나요?</h1>
            <p class="sidebar-copy">잠깐 머물며 생각을 정리하고, 작은 이야기를 나누는 공간이에요.</p>
            <nav class="nav"><a class="active" href="#chat">대화하기</a><a href="newpage.html">새로운 페이지</a></nav>
        </aside>
        <main>
            <div class="topbar"><p>토요일, 9월 5일</p><span class="status"><i></i> 온라인</span></div>
            <section class="intro"><h2>안녕하세요, <span>반가워요.</span></h2><p>무엇이든 편하게 이야기해 주세요.</p></section>
            <section class="chat-card" id="chat">
                <header class="chat-head"><div class="profile"><div class="avatar">🐈</div><div><strong>작은 고양이</strong><small>당신의 이야기를 듣고 있어요</small></div></div><span class="more">···</span></header>
                <div class="messages" id="messages"><div class="message bot">오늘 하루는 어땠나요?<span class="time">방금 전</span></div><div class="message bot">기분 좋은 일도, 마음에 걸리는 일도 괜찮아요. 천천히 들려주세요.<span class="time">방금 전</span></div></div>
                <form class="composer" id="composer"><input id="input" autocomplete="off" placeholder="메시지를 입력해 주세요..." aria-label="메시지 입력"><button class="send" type="submit" aria-label="메시지 보내기">↑</button></form>
            </section>
        </main>
    </div>
    <script>
        const composer = document.querySelector('#composer');
        const input = document.querySelector('#input');
        const messages = document.querySelector('#messages');
        const replies = ['그렇군요. 더 이야기해도 좋아요.', '그 마음을 소중히 간직하고 있군요.', '오늘의 이야기를 들려줘서 고마워요.'];
        composer.addEventListener('submit', (event) => {
            event.preventDefault();
            const value = input.value.trim();
            if (!value) return;
            messages.insertAdjacentHTML('beforeend', `<div class="message user">${value.replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]))}<span class="time">방금 전</span></div>`);
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
            setTimeout(() => messages.insertAdjacentHTML('beforeend', `<div class="message bot">${replies[Math.floor(Math.random() * replies.length)]}<span class="time">방금 전</span></div>`), 450);
        });
    </script>
</body>
</html>
